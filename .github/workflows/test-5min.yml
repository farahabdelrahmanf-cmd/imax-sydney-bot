name: 5-Minute Test Notification

on:
  workflow_dispatch:

jobs:
  delayed_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait exactly 5 minutes in the cloud
        run: |
          echo "Cloud timer started at $(date). Sleeping for 300 seconds..."
          sleep 300
          echo "5 minutes reached at $(date)! Sending test alert to phone..."
          curl -s -X POST https://ntfy.sh \
            -H "Content-Type: application/json" \
            -d '{
              "topic": "imax-odyssey-farah-2026",
              "title": "🎉 24/7 CLOUD TEST SUCCESSFUL!",
              "message": "Your laptop is closed and offline, but GitHub cloud servers just sent this to your phone! The 24/7 ticket monitor is working perfectly.",
              "priority": 5,
              "tags": ["tada", "white_check_mark", "tickets"],
              "click": "https://www.eventcinemas.com.au/cinema/imax-sydney"
            }'
          echo "Notification dispatched successfully!"
